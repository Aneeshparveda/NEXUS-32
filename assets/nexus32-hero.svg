<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="title desc">
  <title id="title">NEXUS-32</title>
  <desc id="desc">NEXUS-32: a PicoRV32 RISC-V SoC with three FIR accelerator engines (sequential, parallel, pipelined) under one Q16.16 contract, targeting the Basys 3 Artix-7 board. Simulation verified; silicon pending.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#060912"/>
      <stop offset="0.62" stop-color="#0b1022"/>
      <stop offset="1" stop-color="#160b2a"/>
    </linearGradient>
    <linearGradient id="title-fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="floor-fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect x="0" y="0" width="1200" height="380" rx="22"/></clipPath>
    <path id="trace-a" d="M 0 92 H 120 L 160 132 H 262"/>
    <path id="trace-b" d="M 1200 84 H 1080 L 1040 124 H 938"/>
    <path id="trace-c" d="M 0 262 H 70 L 104 228 H 168"/>
    <path id="trace-d" d="M 1200 258 H 1134 L 1100 224 H 1032"/>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <circle cx="600" cy="300" r="260" fill="url(#sun)"/>

    <!-- perspective floor grid -->
    <g stroke="url(#floor-fade)" stroke-width="1" opacity="0.55">
      <path d="M 0 300 H 1200 M 0 318 H 1200 M 0 340 H 1200 M 0 366 H 1200"/>
      <path d="M 600 286 L 600 380 M 600 286 L 470 380 M 600 286 L 730 380 M 600 286 L 330 380 M 600 286 L 870 380 M 600 286 L 170 380 M 600 286 L 1030 380 M 600 286 L 0 380 M 600 286 L 1200 380"/>
    </g>
    <rect x="0" y="286" width="1200" height="1.2" fill="#a78bfa" opacity="0.5"/>

    <!-- circuit traces -->
    <g fill="none" stroke="#22d3ee" stroke-width="1.6" opacity="0.35">
      <use href="#trace-a"/><use href="#trace-b"/><use href="#trace-c"/><use href="#trace-d"/>
    </g>
    <g fill="#22d3ee" opacity="0.6">
      <circle cx="262" cy="132" r="3.5"/><circle cx="938" cy="124" r="3.5"/>
      <circle cx="168" cy="228" r="3.5"/><circle cx="1032" cy="224" r="3.5"/>
    </g>
    <g filter="url(#soft)">
      <circle r="3.2" fill="#e0fbff"><animateMotion dur="3.2s" repeatCount="indefinite"><mpath href="#trace-a"/></animateMotion></circle>
      <circle r="3.2" fill="#f5d0fe"><animateMotion dur="3.8s" begin="0.6s" repeatCount="indefinite"><mpath href="#trace-b"/></animateMotion></circle>
      <circle r="3.2" fill="#e0fbff"><animateMotion dur="2.9s" begin="1.1s" repeatCount="indefinite"><mpath href="#trace-c"/></animateMotion></circle>
      <circle r="3.2" fill="#f5d0fe"><animateMotion dur="3.4s" begin="0.3s" repeatCount="indefinite"><mpath href="#trace-d"/></animateMotion></circle>
    </g>

    <!-- HUD corner brackets -->
    <g fill="none" stroke="#a78bfa" stroke-width="2" opacity="0.7">
      <path d="M 28 58 V 28 H 58"/><path d="M 1172 58 V 28 H 1142"/>
      <path d="M 28 322 V 352 H 58"/><path d="M 1172 322 V 352 H 1142"/>
    </g>
    <text x="70" y="44" font-family="JetBrains Mono, Fira Code, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="3" fill="#7dd3fc" opacity="0.75">SOC // RV32I // FIR-ACCEL</text>
    <text x="1130" y="44" text-anchor="end" font-family="JetBrains Mono, Fira Code, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="3" fill="#f0abfc" opacity="0.75">XC7A35T // BASYS 3</text>

    <!-- title with a quiet glitch -->
    <g font-family="JetBrains Mono, Fira Code, SFMono-Regular, Menlo, Consolas, monospace" font-weight="800" font-size="104" letter-spacing="10" text-anchor="middle">
      <text x="603" y="170" fill="#22d3ee" opacity="0">NEXUS-32<animate attributeName="opacity" values="0;0;0.55;0;0;0" keyTimes="0;0.86;0.88;0.9;0.95;1" dur="5s" repeatCount="indefinite"/></text>
      <text x="597" y="170" fill="#f472b6" opacity="0">NEXUS-32<animate attributeName="opacity" values="0;0;0.55;0;0;0" keyTimes="0;0.87;0.89;0.91;0.95;1" dur="5s" repeatCount="indefinite"/></text>
      <text x="600" y="170" fill="url(#title-fill)" filter="url(#glow)">NEXUS-32</text>
    </g>

    <text x="600" y="212" text-anchor="middle" font-family="JetBrains Mono, Fira Code, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" letter-spacing="5" fill="#e2e8f0">ONE SoC · THREE FIR ENGINES · ONE Q16.16 CONTRACT</text>
    <text x="600" y="242" text-anchor="middle" font-family="JetBrains Mono, Fira Code, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="2" fill="#94a3b8">PicoRV32 · Sequential | Parallel | Pipelined · bit-exact Python golden model</text>

    <!-- status chips -->
    <g font-family="JetBrains Mono, Fira Code, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="1.5">
      <rect x="402" y="268" width="190" height="30" rx="15" fill="#052e1a" stroke="#4ade80" stroke-width="1.4"/>
      <circle cx="424" cy="283" r="5" fill="#4ade80"><animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite"/></circle>
      <text x="438" y="288" fill="#bbf7d0">SIM VERIFIED</text>
      <rect x="608" y="268" width="190" height="30" rx="15" fill="#2a1d05" stroke="#fbbf24" stroke-width="1.4"/>
      <circle cx="630" cy="283" r="5" fill="none" stroke="#fbbf24" stroke-width="2"/>
      <text x="644" y="288" fill="#fde68a">SILICON NEXT</text>
    </g>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="378.5" rx="22" fill="none" stroke="#334155" stroke-width="1.5"/>
</svg>
