<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-label="Bar chart of CYCLES_TOTAL at LANES equals 4, 1024 samples, TAP_COUNT 3, simulation only: Sequential 9222, Parallel 5126, Pipelined 8198">
  <rect width="640" height="300" fill="#0a1628"/>
  <text x="320" y="28" text-anchor="middle" fill="#e6edf3" font-family="sans-serif" font-size="16" font-weight="bold">CYCLES_TOTAL — LANES = 4, 1024 samples, TAP_COUNT = 3</text>
  <text x="320" y="48" text-anchor="middle" fill="#8b949e" font-family="sans-serif" font-size="12">Simulation only (Icarus 13.0). Functional block-processing cycles, not throughput or PPA.</text>
  <g font-family="sans-serif" font-size="13" fill="#e6edf3">
    <text x="20" y="105">Sequential</text>
    <rect x="130" y="85" width="460" height="26" fill="#22d3ee"/>
    <text x="596" y="103" text-anchor="end" fill="#0a1628" font-weight="bold">9222</text>
    <text x="20" y="155">Parallel</text>
    <rect x="130" y="135" width="256" height="26" fill="#3fb950"/>
    <text x="392" y="153" text-anchor="end" fill="#0a1628" font-weight="bold">5126</text>
    <text x="20" y="205">Pipelined</text>
    <rect x="130" y="185" width="409" height="26" fill="#f59e0b"/>
    <text x="545" y="203" text-anchor="end" fill="#0a1628" font-weight="bold">8198</text>
  </g>
  <text x="320" y="250" text-anchor="middle" fill="#8b949e" font-family="sans-serif" font-size="12">Source: docs/VERIFICATION_CLOSURE.md. The integrated shell serializes to one outstanding</text>
  <text x="320" y="268" text-anchor="middle" fill="#8b949e" font-family="sans-serif" font-size="12">operation — pipelined cycles rise with LANES because the shell dominates. See README caveat.</text>
</svg>
