name: NEXUS-32 CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus32-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Ubuntu simulation and toolchain regression
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RISCV_CC: riscv64-unknown-elf-gcc
      RISCV_OBJCOPY: riscv64-unknown-elf-objcopy

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linux simulation and RISC-V dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            binutils-riscv64-unknown-elf \
            file \
            gcc-riscv64-unknown-elf \
            git \
            iverilog \
            tcl \
            verilator

      - name: Record CI tool versions
        run: |
          set -euo pipefail
          printf '%s\n' '--- host ---'
          uname -a
          git --version
          printf '%s\n' '--- Python ---'
          python3 --version
          printf '%s\n' '--- Icarus/VVP ---'
          iverilog -V 2>&1 || true
          vvp -V 2>&1 || true
          printf '%s\n' '--- RISC-V toolchain ---'
          command -v "$RISCV_CC"
          command -v "$RISCV_OBJCOPY"
          command -v riscv64-unknown-elf-readelf
          "$RISCV_CC" --version
          "$RISCV_OBJCOPY" --version
          riscv64-unknown-elf-readelf --version
          printf '%s\n' '--- Verilator ---'
          verilator --version

      - name: Run canonical STATUS property regression
        run: bash scripts/run_status_property.sh

      - name: Provision pinned PicoRV32 and base firmware image
        run: |
          set -euo pipefail
          bash scripts/vendor_picorv32.sh
          bash scripts/build_smoke_firmware.sh
          test -f vendor/picorv32/picorv32.v
          test -f firmware/nexus32_smoke.hex

      - name: Run firmware latency regression
        run: bash scripts/run_soc_latency.sh

      - name: Run offline Vivado flow stub
        run: bash scripts/test_basys3_flow_stub.sh

      - name: Test Windows evidence tools (board selection, evidence collector)
        run: bash scripts/test_evidence_tools.sh

      - name: Run Python golden-model tests
        run: python3 -m unittest discover -s tests -v

      - name: Validate RISC-V RV32I toolchain
        run: bash scripts/check_toolchain.sh

      - name: Run RTL smoke regression
        run: bash scripts/run_rtl_smoke.sh

      - name: Run three-way differential FIR regression
        run: make differential

      - name: Run SoC smoke regression across LANES 4, 8, 16, and 32
        run: bash scripts/run_soc_smoke.sh all

      - name: Run UART and board demo firmware regression across LANES 4, 8, 16, and 32
        run: bash scripts/run_soc_demo.sh all

      - name: Check Basys-3 wrapper and XDC port consistency
        run: python3 scripts/check_basys3_constraints.py

      - name: Run characterization provenance test
        run: make provenance-test

      - name: Run Verilator lint against the reviewed warning baseline
        run: make verilator

      - name: Run complete verification closure gate
        run: bash scripts/run_verification_closure.sh

      - name: Run CPU bridge fault-data regression
        run: make test-fault

      - name: Run Python golden-model regression against all three engines
        run: make golden

      - name: Run CPU-driven 1024-sample block regression and its negative modes
        run: make soc-block-1024

      - name: Run CPU-driven subword access regression
        run: make subword

      - name: Build the Windows Vivado handoff bundle (verified, not uploaded)
        run: |
          set -euo pipefail
          bash scripts/make_vivado_bundle.sh
          bundle="$(ls results/handoff/nexus32-vivado-*.zip)"
          unzip -l "$bundle" | grep -q 'nexus32/vendor/picorv32/picorv32.v'
          unzip -l "$bundle" | grep -q 'nexus32/firmware/nexus32_demo.hex'
          unzip -l "$bundle" | grep -q 'nexus32/vivado/RUN_ALL.bat'

      - name: Upload compact verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus32-verification-logs-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            results/verification-closure/verification-closure.log
            results/verification-closure/commands.txt
            results/verification-closure/status.tsv
            results/verification-closure/verilator-lint.log
            results/verification-closure/*.compile.log
            results/verification-closure/*.run.log
            results/verification-closure/stage4b-20261024/firmware-latency/*
